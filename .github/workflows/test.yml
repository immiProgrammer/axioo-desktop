name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test Windows
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: |
          npm ci

      - name: Build and check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run package
          npm run lint
          npm exec tsc -- --noEmit
          npm test

      - name: Verify Electron startup (Windows)
        run: npm run test:smoke
